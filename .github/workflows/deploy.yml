      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 13.49.145.183
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/auto-deploy-site
            git pull origin main
            sudo cp -r ~/auto-deploy-site/* /var/www/html/
